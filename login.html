<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=2.0" />
  <title>KyU | Login</title>
  <link rel="icon" href="images/logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="dist/css/sweetalert2.min.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: url('images/Kilele.jpg') no-repeat center center/cover;
      position: relative;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1;
    }

    .login-container {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(15px);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      color: white;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .login-box .form-control {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      border-radius: 10px;
    }

    .login-box .form-control::placeholder {
      color: #ddd;
    }

    .login-box .btn {
      border-radius: 10px;
    }

    .login-box .logo {
      display: block;
      margin: 0 auto 20px;
      height: 80px;
    }

    #divLoader {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div id="divLoader"><img src="images/ajax-loader.gif" alt="Loading..." /></div>
  <div class="login-container">
    <div class="login-box">
      <img src="images/logo.png" class="logo" alt="KyU Logo">
      <h2>KyU Student Login</h2>

      <div class="mb-3">
        <input type="text" id="txtusername" class="form-control" placeholder="Username" autocomplete="off">
      </div>
      <div class="mb-3">
        <input type="password" id="txtpass" class="form-control" placeholder="Password">
      </div>

      <div class="d-flex justify-content-between">
        <button class="btn btn-warning" onclick="ForgotPassword()">Forgot Password</button>
        <button class="btn btn-success" id="btnLogin" onclick="LoginDemo()">Sign In</button>
      </div>
    </div>
  </div>

  <!-- JS scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/sweetalert2.min.js"></script>
  <script src="Loader/ShowProgression.js"></script>

  <script>
    function LoginDemo() {
  window.location.href = 'dashboard.html';
    }

    

    var LoginUser = function () {
      var username = $("#txtusername").val();
      var password = $("#txtpass").val();
      if (username === "") {
        Swal.fire('Warning', 'Enter Username', 'warning');
        return;
      } else if (password === "") {
        Swal.fire('Warning', 'Enter Your Password', 'warning');
        return;
      } else {
        ShowProgress();
        var Authedication = { Username: username, Password: password };
        $.ajax({
          url: '/Login/LoginUser',
          datatype: "json",
          type: "POST",
          data: JSON.stringify({ userlogin: Authedication }),
          contentType: "application/json; charset=utf-8",
          success: function (data) {
            if (data.success === true) {
              if (data.message === "A") {
                window.location = '/Alumni/Dashboard';
              } else {
                window.location = '/Dashboard/Dashboard';
              }
            } else {
              HideProgress();
              Swal.fire('Warning', data.message, 'warning');
            }
          },
          error: function (err) {
            HideProgress();
            Swal.fire('Error', err.responseText || "Login failed", 'error');
          }
        });
      }
    };

    var ForgotPassword = function () {
      window.location = '/Login/Forgot_Password';
    };

    $("#txtusername, #txtpass").keyup(function (event) {
      if (event.keyCode === 13) {
        $("#btnLogin").click();
      }
    });
  </script>
</body>
</html>
